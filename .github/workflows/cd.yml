# .github/workflows/cd.yml
# main에 들어온 커밋의 CI가 통과하면 온프레미스 서버(gikipedia.https.gsmsv.site)에 배포합니다.
# Actions 탭에서 손으로 다시 배포할 수도 있습니다(workflow_dispatch).
#
# 서버에서는 배포 키로 접속하면 /srv/gikipedia-frontend/deploy.sh만 실행되도록 막아 두었습니다(authorized_keys의
# restrict,command=). 스크립트가 origin/main을 별도 폴더에서 빌드하고 끝나면 바꿔 끼우므로, 빌드가 실패해도
# 돌고 있던 버전이 그대로 남습니다. 서버 구성은 README의 '배포' 절을 봅니다.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 배포가 겹치지 않게 하나씩 돌립니다. 앞의 배포를 끊으면 서버 빌드가 반쯤 남으므로 취소하지 않고 기다립니다.
concurrency:
  group: cd-onprem
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to on-prem
    # CI가 실패한 커밋, PR에서 돈 CI는 배포하지 않습니다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 서버에서 배포 스크립트 실행
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.DEPLOY_SSH_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # 다른 서버가 이 주소를 가로채도 키를 건네지 않도록 호스트 키를 확인합니다.
          fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          command_timeout: 15m
          # 서버가 이 키에는 배포 스크립트만 허용해 아래 명령은 무시되지만, 무엇이 실행되는지 보이도록 적어 둡니다.
          script: /srv/gikipedia-frontend/deploy.sh
